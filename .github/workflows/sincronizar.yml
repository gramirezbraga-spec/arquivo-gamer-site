name: Sincronizar com o Instagram e publicar o site

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botao "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["site/**"]        # quando voce mesmo atualiza o site

permissions:
  contents: write   # para salvar os videos e o dados.js novos
  pages: write
  id-token: write

concurrency:
  group: sincronia-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar posts novos no Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python sincronizar_instagram.py

      - name: Salvar o que mudou
        id: salvar
        run: |
          git config user.name "arquivo-gamer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sincroniza posts do Instagram"
            git push || (git pull --rebase && git push)
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      # So republica o site quando algo mudou, ou quando voce roda na mao / faz push.
      - uses: actions/configure-pages@v5
        if: steps.salvar.outputs.mudou == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.salvar.outputs.mudou == 'true' || github.event_name != 'schedule'
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.salvar.outputs.mudou == 'true' || github.event_name != 'schedule'
